services:
  motilis-back:
    build:
      context: .
      dockerfile: ./apps/motilis-back/Dockerfile
    environment:
      DATABASE_URL: postgres://motilis:motilis@motilis-db:5432/motilis
      TZ: Europe/Paris
    ports:
      - '3000:3000'
    depends_on:
      motilis-db:
        condition: service_healthy
    profiles: [app]

  motilis-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: motilis
      POSTGRES_PASSWORD: motilis
      POSTGRES_DB: motilis
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U motilis -d motilis']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg-data-motilis:/var/lib/postgresql/data

volumes:
  pg-data-motilis:
