  motilis-db:
    image: mongo
    restart: always
    env_file:
      - ./apps/motilis-back/.env
    ports:
      - "27017:27017"
    volumes:
      - ./apps/motilis-back/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo-data-motilis:/data/db




volumes:
  mongo-data-motilis:
    driver: local